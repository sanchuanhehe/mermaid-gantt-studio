name: Project checks
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  editor:
    name: Editor and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: python3 scripts/export-pages.py
  renderer:
    name: Official renderer compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: npm ci --prefix renderer
      - name: Install browser and Chinese fonts
        working-directory: renderer
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:renderer
